<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Mapa – menu účtu, mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#17251c}a:hover{color:#3d5a47}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Public Sans', system-ui, sans-serif; color: #17251c; font-size: 15px; line-height: 1.45; background: #e9efe0">

<!-- Ilustrácia mapy -->
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; inset: 0; display: block" aria-hidden="true">
<rect width="390" height="844" fill="#e9efe0"></rect>
<path d="M0 700 C90 660 160 720 250 690 S 340 650 390 670 L390 844 L0 844 Z" fill="#dfe8d2"></path>
<g fill="none" stroke="#c7d2b6" stroke-width="1.2">
<path d="M-10 200 C60 160 120 230 200 190 S 320 140 400 170"></path>
<path d="M-10 270 C70 230 130 300 210 260 S 330 210 400 240"></path>
<path d="M-10 345 C80 305 140 375 220 335 S 340 285 400 315"></path>
<path d="M-10 420 C90 380 150 450 230 410 S 350 360 400 390"></path>
<path d="M-10 500 C100 460 160 530 240 490 S 360 440 400 470"></path>
<path d="M-10 580 C110 540 170 610 250 570 S 370 520 400 550"></path>
</g>
<path d="M90 560 C120 540 170 545 180 570 C 188 592 150 608 118 600 C 92 594 75 575 90 560 Z" fill="#a9cfe6" stroke="#8bbad6" stroke-width="1"></path>
<g fill="none" stroke-linecap="round">
<path d="M210 420 C250 380 290 330 330 280 S 370 220 390 190" stroke="#d32f2f" stroke-width="3"></path>
<path d="M210 420 C250 470 310 500 390 540" stroke="#2e7d32" stroke-width="3"></path>
<path d="M180 580 C200 650 190 740 210 844" stroke="#f9a825" stroke-width="3"></path>
</g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 470 C50 480 110 520 150 560 S 175 575 180 580" stroke="#ffffff" stroke-width="12"></path>
<path d="M0 470 C50 480 110 520 150 560 S 175 575 180 580" stroke="#d32f2f" stroke-width="7"></path>
<path d="M180 580 C190 530 200 470 210 420" stroke="#ffffff" stroke-width="12"></path>
<path d="M180 580 C190 530 200 470 210 420" stroke="#d32f2f" stroke-width="7"></path>
<path d="M210 420 C190 360 170 300 160 240 S 140 150 130 120" stroke="#ffffff" stroke-width="12"></path>
<path d="M210 420 C190 360 170 300 160 240 S 140 150 130 120" stroke="#2e7d32" stroke-width="7"></path>
</g>
<g fill="#ffffff" stroke="#17251c" stroke-width="2">
<circle cx="180" cy="580" r="5"></circle>
<circle cx="210" cy="420" r="5"></circle>
</g>
</svg>

<!-- Logo Mapy.com -->
<a href="https://mapy.com" style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 8px; background: #ffffff; text-decoration: none; font-weight: 800; font-size: 14px; color: #17251c; box-shadow: 0 2px 8px rgba(23,37,28,0.18)">Mapy.com</a>

<!-- Panel nástrojov -->
<div style="position: absolute; top: 56px; left: 12px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 14px; background: #ffffff; border: 1px solid #e1e6da; box-shadow: 0 8px 24px -12px rgba(23,37,28,0.35); font-size: 14px">
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" style="accent-color: #17251c"> Rýchly režim</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: #17251c"> Sieť úsekov</label>
<span style="font-size: 13px; color: #4a5a4f">Prejdené: 27</span>
</div>

<!-- Tlačidlo účtu: na mobile len ikona -->
<button type="button" aria-haspopup="menu" aria-expanded="{{open}}" aria-label="Môj účet" onClick="{{toggle}}" style="position: absolute; top: 8px; right: 12px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border-radius: 999px; border: 3px solid #ffffff; background: #17251c; color: #ffffff; cursor: pointer; box-shadow: 0 8px 20px -10px rgba(23,37,28,0.6)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
</button>

<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<!-- Stmavenie mapy pod menu -->
<button type="button" aria-label="Zavrieť menu" onClick="{{toggle}}" style="position: absolute; inset: 0; top: 60px; width: 100%; border: 0; padding: 0; background: rgba(23,37,28,0.25); cursor: pointer"></button>

<div role="menu" aria-label="Môj účet" style="position: absolute; top: 62px; left: 12px; right: 12px; display: flex; flex-direction: column; border-radius: 18px; background: #ffffff; border: 1px solid #e1e6da; box-shadow: 0 24px 48px -20px rgba(23,37,28,0.5); overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px; background: #f4f6f1; border-bottom: 1px solid #e1e6da">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #4a5a4f">Prihlásený ako</span>
<span style="font-weight: 700; font-size: 15px; overflow-wrap: anywhere">[e-mail používateľa]</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="padding: 4px 10px; border-radius: 999px; background: #17251c; color: #ffffff; font-size: 12px; font-weight: 700">Ročné predplatné</span>
<span style="font-size: 13px; color: #4a5a4f">do [dátum]</span>
</div>
</div>
<div style="display: flex; flex-direction: column; padding: 6px">
<a role="menuitem" href="#profil" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17251c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
Profil
</a>
<a role="menuitem" href="#nastavenia" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17251c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
Nastavenia
</a>
<a role="menuitem" href="#predplatne" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17251c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path><path d="M7 15h4"></path></svg>
Predplatné
</a>
</div>
<div style="padding: 6px; border-top: 1px solid #e1e6da">
<button type="button" role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #b3261e; font-family: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5"></path><path d="M5 12h11"></path></svg>
Odhlásiť sa
</button>
</div>
</div>
</sc-if>

<div style="position: absolute; right: 0; bottom: 0; padding: 3px 8px; background: rgba(255,255,255,0.85); font-size: 10px; color: #33443a; border-top-left-radius: 6px">© Seznam.cz a.s. and others · © OpenStreetMap contributors</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: true };
}
renderVals() {
return {
open: this.state.open,
toggle: () => this.setState({ open: !this.state.open })
};
}
}
</script>
</body>
</html>
